<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Write Quiet Light support. We read every message." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#FAFAF7" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Support – Quiet Light" />
  <meta property="og:description" content="Write Quiet Light support. We read every message." />
  <meta property="og:url" content="https://quietlight.app/support/" />
  <meta property="og:image" content="https://quietlight.app/images/og-image.png" />
  <meta property="og:site_name" content="Quiet Light" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Support – Quiet Light" />
  <meta name="twitter:description" content="Write Quiet Light support. We read every message." />
  <meta name="twitter:image" content="https://quietlight.app/images/og-image.png" />
  <link rel="canonical" href="https://quietlight.app/support/" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/site-nav.css?v=20261029">
  <link rel="stylesheet" href="/css/site-motion.css?v=20261029">
  <title>Support – Quiet Light</title>
  <style>
    :root {
      --text: #1A1A1A;
      --text-secondary: #57544E;
      --link: #1A1A1A;
      --background-root: #FAFAF7;
      --background-default: #FFFFFF;
      --background-secondary: #F5F5F0;
      --border: #E8E8E5;
      --spacing-xl: 28px;
      --spacing-lg: 20px;
      --spacing-md: 14px;
      --spacing-sm: 10px;
      --spacing-xs: 6px;
      --spacing-3xl: 40px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background-root);
      color: var(--text);
      line-height: 1.6;
    }

    body { display: flex; flex-direction: column; }

    main {
      flex: 1;
      padding: var(--spacing-xl) var(--spacing-xl) var(--spacing-3xl);
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
      background: var(--background-default);
    }

    .title {
      font-size: 2.1rem;
      font-weight: 600;
      margin-bottom: var(--spacing-xs);
      color: var(--text);
    }

    .intro {
      font-size: 1.02rem;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-xl);
      line-height: 1.6;
    }

    .support-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .support-form label {
      display: block;
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .support-form input,
    .support-form textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--background-root);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
    }

    .support-form input:focus,
    .support-form textarea:focus {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    .support-form textarea {
      min-height: 9rem;
      resize: vertical;
    }

    .hp {
      position: absolute;
      left: 0;
      top: 0;
      height: 0;
      width: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .support-submit {
      align-self: flex-start;
      margin-top: 4px;
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      background: var(--text);
      color: #fff;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .support-submit:hover { opacity: 0.9; }
    .support-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .support-status {
      margin-top: var(--spacing-lg);
      font-size: 1rem;
      line-height: 1.55;
    }

    .support-status--ok { color: var(--text); }
    .support-status--error { color: #8a2a2a; }

    .privacy-note {
      margin-top: var(--spacing-lg);
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      main { padding: var(--spacing-lg) var(--spacing-lg) var(--spacing-3xl); }
      .title { font-size: 1.9rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="title">Support</h1>
    <p class="intro">
      Write what’s going on with Quiet Light. We read every message.
    </p>

    <form id="support-form" class="support-form" novalidate>
      <div class="hp" aria-hidden="true">
        <label for="hp-company-url">Company website</label>
        <input id="hp-company-url" name="hp_company_url" type="text" tabindex="-1" autocomplete="off" />
        <label for="hp-fax">Fax</label>
        <input id="hp-fax" name="hp_fax" type="text" tabindex="-1" autocomplete="off" />
        <input type="hidden" name="form_started" value="" />
        <input type="hidden" name="form_token" value="" />
      </div>

      <div>
        <label for="support-name">Name</label>
        <input id="support-name" name="name" type="text" autocomplete="name" required maxlength="100" />
      </div>
      <div>
        <label for="support-email">Email</label>
        <input id="support-email" name="email" type="email" autocomplete="email" required maxlength="254" />
      </div>
      <div>
        <label for="support-message">Message</label>
        <textarea id="support-message" name="message" required maxlength="4000"></textarea>
      </div>
      <button class="support-submit" type="submit">Send message</button>
    </form>

    <p id="support-status" class="support-status" hidden></p>
    <p class="privacy-note">
      We’ll only use these details to reply. See our
      <a href="/privacy/">Privacy Policy</a>.
    </p>
  </main>
  <footer></footer>
  <script src="/js/site-nav.js?v=20261030"></script>
  <script src="/js/support-form.js"></script>
</body>
</html>
