<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#FAFAF7" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/site-nav.css?v=20261029">
  <link rel="stylesheet" href="css/site-motion.css?v=20261029">
  <title>Not found – Quiet Light</title>
  <style>
    :root {
      --text: #1A1A1A;
      --text-secondary: #57544E;
      --background-root: #FAFAF7;
      --background-secondary: #F5F5F0;
      --border: #E8E8E5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background-root);
      color: var(--text);
      line-height: 1.7;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .code {
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 500;
      margin: 0 0 16px;
      color: var(--text);
    }

    .body {
      max-width: 400px;
      font-size: 1.05rem;
      color: var(--text-secondary);
      margin: 0 0 40px;
    }

    .hint {
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .body a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.25s ease, opacity 0.25s ease;
    }

    .body a:hover,
    .body a:focus-visible {
      border-bottom-color: currentColor;
      opacity: 0.9;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This path has no answer</h1>
    <p class="body">
      Only a gentle invitation to return — to stillness, to home, or to a
      <a href="pause.html">quiet pause</a> along the way.
    </p>
    <p class="hint">Use the menu above to find your way back.</p>
  </main>

  <footer></footer>
  <script src="js/site-nav.js?v=20261029" defer></script>
</body>
</html>
